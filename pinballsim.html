    let rawAudioData = null;     
    let finalAudioBuffer = null; 
    let isDecoding = false;
    
    fetch(GOAL_AUDIO_BASE64)
    .then(res => res.arrayBuffer())
    .then(data => {
        rawAudioData = data;
        console.log("✅ Ham ses verisi indirildi, decode için oyun motoru bekleniyor...");
    }).catch(e => console.log("Base64 bos veya hatali."));

    const AudioEngine = {
        ctx: null, dest: null,
        init: function() { 
            window.AudioContext = window.AudioContext || window.webkitAudioContext; 
            this.ctx = new AudioContext(); 
            this.dest = this.ctx.createMediaStreamDestination(); 
        },
        playBumper: function() {
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(500 + Math.random() * 300, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.02, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination); gain.connect(this.dest); osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        },
        playGoal: async function() {
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') this.ctx.resume();

            if (!finalAudioBuffer && rawAudioData && !isDecoding) {
                isDecoding = true;
                try {
                    finalAudioBuffer = await this.ctx.decodeAudioData(rawAudioData.slice(0));
                } catch (e) { console.error("Ses çözülürken hata:", e); }
                isDecoding = false;
            }

            if (!finalAudioBuffer) return; 

            const source = this.ctx.createBufferSource();
            source.buffer = finalAudioBuffer;
            source.connect(this.ctx.destination); 
            if (this.dest) source.connect(this.dest); 
            source.start(0);
        },
        playOut: function() {
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime); 
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination); gain.connect(this.dest); 
            osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        }
    };

    const CONFIG = { width: 540, height: 960, ballSize: 12, spawnRate: 800, gravity: 0.29 };
    const { Engine, World, Bodies, Composite, Events, Body } = Matter;
    
    let engine, world, canvas, ctx, isRunning = false, isMatchFinished = false, spawnInterval;
    let matchTotalSeconds = 30, realTime = 0, teamAScore = 0, teamBScore = 0;
    let particles = [], screenShake = 0, biasFactor = 0.5;
    let keeperA, keeperB, mediaRecorder, recordedChunks = [];

    let uiState = { timer: "00:00", overlayOpacity: 0, overlayTitle: "", overlaySub: "", overlayColor: "#fff", flashOpacity: 0, flashColor: "#fff" };

    function analyzeBias() {
        const hist = document.getElementById('history').value.split(',');
        let wA = 0, wB = 0; hist.forEach(s => { const parts = s.split('-'); if(parts.length===2){ if(parts[0]>parts[1]) wA++; else if(parts[1]>parts[0]) wB++; } });
        biasFactor = Math.max(0.3, Math.min(0.7, 0.5 + ((wA - wB) * 0.05)));
    }
    
    function init() {
        canvas = document.getElementById('world'); 
        const dpr = window.devicePixelRatio || 1;
        canvas.width = CONFIG.width * dpr; canvas.height = CONFIG.height * dpr;
        canvas.style.width = CONFIG.width + "px"; canvas.style.height = CONFIG.height + "px";
        ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
        engine = Engine.create(); world = engine.world; engine.gravity.y = CONFIG.gravity;
        document.getElementById('start-btn').addEventListener('click', startGame);
        requestAnimationFrame(renderLoop);
    }
    
    function setupWorld() {
        World.clear(world); Engine.clear(engine); teamAScore = 0; teamBScore = 0; uiState.overlayOpacity = 0;
        logoImages.A.src = document.getElementById('teamALogo').value;
        logoImages.B.src = document.getElementById('teamBLogo').value;
        logoImages.League.src = document.getElementById('leagueLogo').value;

        const walls = [
            Bodies.rectangle(0, CONFIG.height/2, 20, CONFIG.height, { isStatic: true, render: { visible: false } }),
            Bodies.rectangle(CONFIG.width, CONFIG.height/2, 20, CONFIG.height, { isStatic: true, render: { visible: false } }),
            Bodies.rectangle(CONFIG.width/2, -50, CONFIG.width, 40, { isStatic: true })
        ];
        const pegs = [];
        for (let row = 0; row < 11; row++) {
            let cols = row % 2 === 0 ? 7 : 8;
            for (let col = 0; col < cols; col++) {
                pegs.push(Bodies.circle(60 + col * 60 + (row % 2 === 0 ? 30 : 0), 220 + row * 52, 6, { isStatic: true, label: 'peg', restitution: 0.85 }));
            }
        }
        const goalW = 70; const goalH = 20; const goalOpt = { isStatic: true, isSensor: true, label: 'goal' }; 
        const goal1 = Bodies.rectangle(180, CONFIG.height - 25, goalW, goalH, goalOpt);
        const goal2 = Bodies.rectangle(360, CONFIG.height - 25, goalW, goalH, goalOpt);
        keeperA = Bodies.rectangle(180, CONFIG.height - 70, 45, 15, { isStatic: true, label: 'keeper', restitution: 1.2, chamfer: {radius: 5} });
        keeperB = Bodies.rectangle(360, CONFIG.height - 70, 45, 15, { isStatic: true, label: 'keeper', restitution: 1.2, chamfer: {radius: 5} });
        const slingL = Bodies.fromVertices(20, CONFIG.height - 20, [{x:0, y:0}, {x:40, y:40}, {x:0, y:40}], { isStatic: true, restitution: 1.8, label: 'slingshot' });
        const slingR = Bodies.fromVertices(CONFIG.width - 20, CONFIG.height - 20, [{x:0, y:0}, {x:0, y:40}, {x:-40, y:40}], { isStatic: true, restitution: 1.8, label: 'slingshot' });
        const outOpt = { isStatic: true, isSensor: true, label: 'out' };
        const outCenter = Bodies.rectangle(270, CONFIG.height - 10, 100, goalH, outOpt);
        const outLeft = Bodies.rectangle(95, CONFIG.height - 10, 90, goalH, outOpt); 
        const outRight = Bodies.rectangle(445, CONFIG.height - 10, 90, goalH, outOpt);
        World.add(world, [...walls, ...pegs, goal1, goal2, keeperA, keeperB, slingL, slingR, outLeft, outCenter, outRight]);
        
        Events.on(engine, 'collisionStart', (e) => {
            if (!isRunning) return;
            e.pairs.forEach((p) => {
                const bodyA = p.bodyA; const bodyB = p.bodyB;
                const lA = bodyA.label; const lB = bodyB.label;
                const ball = lA.includes('ball') ? bodyA : (lB.includes('ball') ? bodyB : null);
                const obstacle = ball === bodyA ? bodyB : (ball === bodyB ? bodyA : null);

                if (ball && !ball.isScored) {
                    if (lA === 'goal' || lB === 'goal') { ball.isScored = true; handleGoal(ball.team, ball); }
                    else if (lA === 'out' || lB === 'out') { ball.isScored = true; handleOut(ball); }
                }
                
                if (lA === 'peg' || lB === 'peg' || lA === 'keeper' || lB === 'keeper' || lA === 'slingshot' || lB === 'slingshot') {
                    AudioEngine.playBumper();
                    
                    if (ball && obstacle && (obstacle.label === 'peg' || obstacle.label === 'slingshot')) {
                        const hitColor = ball.colors ? ball.colors[1] : '#ffffff';
                        const isSlingshot = obstacle.label === 'slingshot';
                        effectFades.push({
                            type: 'pegGlow',
                            x: obstacle.position.x,
                            y: obstacle.position.y,
                            radius: isSlingshot ? 30 : obstacle.circleRadius + 2, 
                            alpha: 1, 
                            color: hitColor 
                        });
                    }
                }
            });
        });
    }
    
    function spawnBall() {
        if (!isRunning) return;
        const isTeamA = Math.random() < biasFactor;
        const ball = Bodies.circle(Math.random() * (CONFIG.width - 200) + 100, -20, CONFIG.ballSize, { restitution: 0.8, friction: 0.005, density: 0.05, label: isTeamA ? 'ballA' : 'ballB' });
        ball.team = isTeamA ? 'A' : 'B';
        ball.colors = isTeamA ? [document.getElementById('teamAColor1').value, document.getElementById('teamAColor2').value] : [document.getElementById('teamBColor1').value, document.getElementById('teamBColor2').value];
        ball.isScored = false; World.add(world, ball);
    }
    
    function handleGoal(team, ballBody) {
        if (team === 'A') teamAScore++; else teamBScore++;
        AudioEngine.playGoal(); screenShake = 25;
        const teamColor = team === 'A' ? document.getElementById('teamAColor2').value : document.getElementById('teamBColor2').value;
        const teamName = team === 'A' ? document.getElementById('teamAName').value : document.getElementById('teamBName').value;
        
        uiState.flashColor = teamColor; uiState.flashOpacity = 0.9;
        uiState.overlayTitle = "GOAL!"; uiState.overlaySub = teamName; uiState.overlayColor = teamColor; uiState.overlayOpacity = 1.0;
        
        isGoalFlashing = true;
        goalFlashColor = teamColor;

        for(let i=0; i<50; i++) particles.push({ x: ballBody.position.x, y: ballBody.position.y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, life: 1.0, color: teamColor });
        
        setTimeout(() => { 
            if (!isMatchFinished) uiState.overlayOpacity = 0; 
            isGoalFlashing = false; 
        }, 1500);
        
        Composite.allBodies(world).filter(b => b.label.includes('ball')).forEach(b => World.remove(world, b));
    }
    
    function handleOut(ballBody) {
        AudioEngine.playOut();
        for(let i=0; i<10; i++) particles.push({ x: ballBody.position.x, y: ballBody.position.y - 10, vx: (Math.random()-0.5)*5, vy: -(Math.random()*5), life: 0.5, color: '#555' });
        World.remove(world, ballBody);
    }

    function startRecording() {
        recordedChunks = [];
        const canvasStream = canvas.captureStream(60); 
        let combinedStream = canvasStream;
        if (AudioEngine.dest) {
            combinedStream = new MediaStream([...canvasStream.getTracks(), ...AudioEngine.dest.stream.getTracks()]);
        }

        const options = { mimeType: 'video/webm; codecs=vp8', videoBitsPerSecond: 8000000 };
        try { mediaRecorder = new MediaRecorder(combinedStream, options); } 
        catch (e) { mediaRecorder = new MediaRecorder(combinedStream); }
        
        mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
            a.download = `${document.getElementById('teamAName').value.replace(/\s+/g, '_')}_vs_${document.getElementById('teamBName').value.replace(/\s+/g, '_')}_Match.webm`;
            document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url);
        };
        mediaRecorder.start(100);
    }
    
    function startGame() {
        AudioEngine.init(); analyzeBias(); setupWorld();
        matchTotalSeconds = parseInt(document.getElementById('matchDuration').value);
        isRunning = true; isMatchFinished = false; realTime = 0; uiState.timer = "00:00";
        isGoalFlashing = false;
        
        startRecording();

        if(spawnInterval) clearInterval(spawnInterval);
        spawnInterval = setInterval(spawnBall, CONFIG.spawnRate);
        const timerInterval = setInterval(() => {
            if(!isRunning) return clearInterval(timerInterval);
            realTime++; const m = Math.floor((realTime / matchTotalSeconds) * 90);
            uiState.timer = `${m < 10 ? '0'+m : m}:00`;
            if(realTime >= matchTotalSeconds) { 
                isRunning = false; isMatchFinished = true; clearInterval(spawnInterval); clearInterval(timerInterval);
                Composite.allBodies(world).filter(b => b.label.includes('ball')).forEach(b => World.remove(world, b));
                let wText = "CHICKEN DINNER", wColor = "#fff";
                if (teamAScore > teamBScore) { wText = document.getElementById('teamAName').value; wColor = document.getElementById('teamAColor2').value; } 
                else if (teamBScore > teamAScore) { wText = document.getElementById('teamBName').value; wColor = document.getElementById('teamBColor2').value; }
                
                uiState.overlayTitle = "FULL TIME"; uiState.overlaySub = "WINNER: " + wText; uiState.overlayColor = wColor; uiState.overlayOpacity = 1.0;
                
                setTimeout(() => { if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }, 3000);
            }
        }, 1000);
    }
    
    function renderLoop() {
        if (!ctx || !engine) return;
        
        Engine.update(engine, 1000 / 60); 
        const time = engine.timing.timestamp;
        if (keeperA && keeperB) {
            Body.setPosition(keeperA, { x: 180 + Math.sin(time * 0.003) * 40, y: keeperA.position.y });
            Body.setPosition(keeperB, { x: 360 + Math.sin(time * 0.003 + Math.PI) * 40, y: keeperB.position.y });
        }
        
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.save();
        if (screenShake > 0) { ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake); screenShake *= 0.85; }
        ctx.strokeStyle = 'rgba(57, 255, 20, 0.1)'; 
        ctx.lineWidth = 1;
        for (let x=0; x<CONFIG.width; x+=40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CONFIG.height); ctx.stroke(); }
        for (let y=0; y<CONFIG.height; y+=40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CONFIG.width, y); ctx.stroke(); }

        if (uiState.flashOpacity > 0) {
            let grad = ctx.createRadialGradient(CONFIG.width/2, CONFIG.height/2, 0, CONFIG.width/2, CONFIG.height/2, CONFIG.width);
            grad.addColorStop(0, uiState.flashColor); grad.addColorStop(1, 'transparent');
            ctx.globalAlpha = uiState.flashOpacity; ctx.fillStyle = grad; ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
            ctx.globalAlpha = 1; uiState.flashOpacity -= 0.05;
        }

        // 4: DAHA UZUN VE BELİRGİN NEON IŞIK KUYRUKLARI
        Composite.allBodies(world).forEach(b => {
            if (b.label && b.label.includes('ball')) {
                if (!ballTrails.has(b.id)) ballTrails.set(b.id, []);
                const trail = ballTrails.get(b.id);
                trail.push({ x: b.position.x, y: b.position.y });
                // Uzunluk 8'den 16'ya çıkarıldı
                if (trail.length > 16) trail.shift(); 
                
                const trailColor = (b.colors && b.colors.length > 1) ? b.colors[1] : '#ffffff';

                trail.forEach((p, i) => {
                    // Parlaklık 0.5'ten 0.7'ye çıkarıldı
                    const alpha = (i / trail.length) * 0.7; 
                    // Yarıçap büyütüldü (CONFIG.ballSize)
                    const radius = (i / trail.length) * CONFIG.ballSize; 
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = hexToRgba(trailColor, alpha); 
                    // Glow etkisi 10'dan 15'e çıkarıldı
                    ctx.shadowBlur = 5; 
                    ctx.shadowColor = trailColor;
                    ctx.fill();
                    ctx.closePath();
                    ctx.shadowBlur = 0; 
                });
            }
        });

        Composite.allBodies(world).forEach(b => {
            if (b.label && b.label.includes('ball') && b.velocity.y > 15) { Body.setVelocity(b, { x: b.velocity.x, y: 15 }); }
            
            ctx.beginPath();
            if (b.label === 'goal') {
                const v = b.vertices; ctx.moveTo(v[0].x, v[0].y); for (let j=1; j<v.length; j++) ctx.lineTo(v[j].x, v[j].y); ctx.closePath();
                ctx.fillStyle = 'rgba(15, 15, 20, 0.95)'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = 'var(--neon-neutral)'; ctx.stroke();
            } else if (b.label.includes('ball')) {
                const r = b.circleRadius; ctx.shadowBlur = 10; ctx.shadowColor = b.colors[1];
                const grad = ctx.createLinearGradient(b.position.x-r, b.position.y-r, b.position.x+r, b.position.y+r);
                grad.addColorStop(0, b.colors[0]); grad.addColorStop(1, b.colors[1]);
                ctx.fillStyle = grad; ctx.arc(b.position.x, b.position.y, r, 0, 2 * Math.PI); ctx.fill();
                
                const img = b.team === 'A' ? logoImages.A : logoImages.B;
                if(img.complete && img.naturalHeight !== 0) { ctx.save(); ctx.clip(); ctx.drawImage(img, b.position.x-r, b.position.y-r, r*2, r*2); ctx.restore(); }
            } else if (b.label === 'peg') {
                ctx.arc(b.position.x, b.position.y, b.circleRadius, 0, 2 * Math.PI); ctx.fillStyle = '#1a1a25'; ctx.fill(); 
                ctx.lineWidth = 2; 
                ctx.strokeStyle = isGoalFlashing ? goalFlashColor : 'rgba(220, 221, 22, 0.51)'; 
                if(isGoalFlashing) { ctx.shadowBlur = 10; ctx.shadowColor = goalFlashColor; }
                ctx.stroke();
            } else if (b.label === 'keeper') {
                const v = b.vertices; ctx.moveTo(v[0].x, v[0].y); for (let j=1; j<v.length; j++) ctx.lineTo(v[j].x, v[j].y); ctx.closePath(); 
                ctx.fillStyle = '#eee'; ctx.fill(); 
                if(isGoalFlashing) { ctx.shadowBlur = 15; ctx.shadowColor = goalFlashColor; ctx.strokeStyle = goalFlashColor; ctx.lineWidth=2; ctx.stroke(); }
            } else if (b.label === 'slingshot') {
                const v = b.vertices; ctx.moveTo(v[0].x, v[0].y); for (let j=1; j<v.length; j++) ctx.lineTo(v[j].x, v[j].y); ctx.closePath(); 
                ctx.fillStyle = '#111'; ctx.fill(); ctx.lineWidth = 3; 
                ctx.strokeStyle = isGoalFlashing ? goalFlashColor : 'var(--neon-secondary)'; 
                if(isGoalFlashing) { ctx.shadowBlur = 15; ctx.shadowColor = goalFlashColor; }
                ctx.stroke();
            }
            ctx.shadowBlur = 0; 
        });

        effectFades.forEach((eff, i) => {
            eff.alpha -= 0.05; 
            if (eff.alpha <= 0) { effectFades.splice(i, 1); return; }
            ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.radius, 0, 2 * Math.PI);
            ctx.fillStyle = hexToRgba(eff.color, eff.alpha);
            ctx.fill(); ctx.closePath();
        });

        ctx.fillStyle = 'rgba(15, 15, 20, 0.95)'; ctx.fillRect(0, 0, CONFIG.width, 100);
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(CONFIG.width, 100); ctx.stroke();

        if(logoImages.A.complete && logoImages.A.naturalHeight !== 0) {
            ctx.save(); ctx.beginPath(); ctx.arc(50, 50, 25, 0, Math.PI*2); ctx.clip(); ctx.drawImage(logoImages.A, 25, 25, 50, 50); ctx.restore();
            ctx.beginPath(); ctx.arc(50, 50, 25, 0, Math.PI*2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.fillStyle = document.getElementById('teamAColor2').value; ctx.font = "900 35px Orbitron"; ctx.textAlign = "left"; ctx.fillText(teamAScore, 90, 65);

        if(logoImages.B.complete && logoImages.B.naturalHeight !== 0) {
            ctx.save(); ctx.beginPath(); ctx.arc(CONFIG.width - 50, 50, 25, 0, Math.PI*2); ctx.clip(); ctx.drawImage(logoImages.B, CONFIG.width - 75, 25, 50, 50); ctx.restore();
            ctx.beginPath(); ctx.arc(CONFIG.width - 50, 50, 25, 0, Math.PI*2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.fillStyle = document.getElementById('teamBColor2').value; ctx.textAlign = "right"; ctx.fillText(teamBScore, CONFIG.width - 90, 65);

        ctx.textAlign = "center";
        if(logoImages.League.complete && logoImages.League.naturalHeight !== 0) { ctx.drawImage(logoImages.League, CONFIG.width/2 - 20, 10, 40, 40); }
        ctx.fillStyle = "#ddd"; ctx.font = "700 12px Orbitron"; ctx.fillText(document.getElementById('leagueName').value, CONFIG.width/2, 65);
        
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(CONFIG.width/2 - 35, 72, 70, 25);
        ctx.strokeStyle = "#555"; ctx.strokeRect(CONFIG.width/2 - 35, 72, 70, 25);
        ctx.fillStyle = "#fff"; ctx.font = "700 16px Orbitron"; ctx.fillText(uiState.timer, CONFIG.width/2, 90);

        ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.font = "700 10px Orbitron"; ctx.letterSpacing = "5px"; ctx.fillText("POWERED BY HECT0R", CONFIG.width/2, CONFIG.height - 15);

        if (uiState.overlayOpacity > 0) {
            ctx.globalAlpha = uiState.overlayOpacity;
            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, CONFIG.height/2 - 80, CONFIG.width, 160);
            ctx.shadowBlur = 30; ctx.shadowColor = uiState.overlayColor; ctx.fillStyle = uiState.overlayColor;
            ctx.font = "900 55px Orbitron"; ctx.fillText(uiState.overlayTitle, CONFIG.width/2, CONFIG.height/2 + 10);
            ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.font = "700 20px Orbitron"; ctx.fillText(uiState.overlaySub, CONFIG.width/2, CONFIG.height/2 + 50);
            ctx.globalAlpha = 1;
        }

        for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.04; if (p.life <= 0) particles.splice(i, 1); else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); ctx.globalAlpha = 1; } }
        
        ctx.restore(); 
        requestAnimationFrame(renderLoop);
    }

    function hexToRgba(hex, alpha) {
        if (!hex) hex = "#FFFFFF";
        var c;
        if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
            c= hex.substring(1).split('');
            if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
            c= '0x'+c.join('');
            return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
        }
        return hex; 
    }

    init();
</script>
</body>
